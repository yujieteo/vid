name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compile:   # only a syntax check: CI has no Blender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m py_compile $(git ls-files '*.py')
