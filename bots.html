<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bots</title>
<link rel="stylesheet" href="player.css">
<main id="pic"></main>
<script src="look.js"></script>
<script>
// All the bots of CAST on 1 screen, with no voice. Each bot does each of its moves once in a loop of LOOP seconds,
// at its own times. Between the moves, it lives by itself (it breathes, looks around, blinks and squints).
const LOOP = 12;
const bots = (t) => [[1.75, 0.4, 1.5], [0.45, 0.45, 1.6], [-0.85, 0.5, 1.7]]   // each row: [ground, size, step]
  .map(([z, size, step], r) => row(6, 0, step).map((x, c) => {
    const i = 6 * r + c, u = (t + LOOP * hash(77, i)) % LOOP, side = i % 2 ? 1 : -1;
    return blob(x, t, CAST[i], { z, s: size }, pop(t, 0.3 + 0.06 * i),
      look(u, 1, 2.3, side, 0.7), blink(u, 3.1), follow(u, 3.9, 5.5, side, -side),
      squint(u, 6.3), hop(u, 8, 0.6, 0.55), squash(u, 9.8));
  }).join("")).join("");

(function frame() {
  const t = performance.now() / 1000;
  document.getElementById("pic").innerHTML = svg(bots(t), t);
  requestAnimationFrame(frame);
})();
</script>
