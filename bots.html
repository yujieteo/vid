<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot</title>
<link rel="stylesheet" href="player.css">
<main id="pic"></main>
<script src="look.js"></script>
<script>
// 1 bot in the Grok Bot style, large and in the middle, with no voice. It does each of its moves once in a loop of LOOP
// seconds. Between the moves, it lives by itself (it breathes, looks around, blinks and squints).
const LOOP = 12, BOT = { shape: "ball", color: "hotpink", eyes: "white" };
const bot = (t) => {
  const u = t % LOOP;
  return blob(0, t, BOT, { s: 1.5 }, pop(t, 0.3), look(u, 1, 2.3, 1, 0.7), blink(u, 3.1), follow(u, 3.9, 5.5, 1, -1),
    squint(u, 6.3), hop(u, 8, 0.6, 0.55), squash(u, 9.6), wave(u, 10.5, 1.2));
};

(function frame() {
  document.getElementById("pic").innerHTML = svg(bot(performance.now() / 1000));
  requestAnimationFrame(frame);
})();
</script>
